<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Annkis Adventskalender</title>
  <style>
    :root {
      --bg: #10251e;
      --card: #20372d;
      --card-soft: #2b493a;
      --accent: #efc36a;
      --accent-hover: #d9a74f;
      --success: #82b98b;
      --error: #e0786b;
      --warn: #f0cc71;
      --text: #f8f2e5;
      --muted: #b8c8b9;
      --border: #4b6854;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 50% 0, rgba(42, 91, 59, 0.55), transparent 58%),
        linear-gradient(155deg, #11291f, #111b27 82%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    .background-dots {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .background-dots span {
      position: absolute;
      display: block;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
    }

    header {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 18px;
    }

    header a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .badge {
      background: rgba(136, 55, 45, 0.24);
      border: 1px solid rgba(239, 195, 106, 0.45);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #f3cf83;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: linear-gradient(145deg, rgba(35, 62, 46, 0.97), rgba(27, 43, 46, 0.97));
      border: 1px solid rgba(239, 195, 106, 0.3);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.36), 0 0 24px rgba(239, 195, 106, 0.06);
    }

    main::before {
      content: "";
      position: absolute;
      top: 0;
      left: 22%;
      right: 22%;
      height: 3px;
      border-radius: 0 0 999px 999px;
      background: linear-gradient(90deg, transparent, #b44e43, #efc36a, #b44e43, transparent);
      pointer-events: none;
    }

    main::after {
      content: "🐭  🐻";
      position: absolute;
      top: 7px;
      right: 16px;
      font-size: 0.95rem;
      opacity: 0.85;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
      pointer-events: none;
    }

    h1 { font-size: 1.45rem; margin-bottom: 6px; }
    h2 { font-size: 1.2rem; margin-bottom: 12px; color: #f0c66f; }
    p { margin-bottom: 14px; }
    .muted { color: var(--muted); font-size: 0.9rem; }

    input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(12, 28, 24, 0.8);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #f1cb78, #dca64f);
      color: #253426;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
      margin-bottom: 10px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
    }

    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: default; }

    button.secondary {
      background: rgba(46, 75, 58, 0.94);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }

    button:not(.secondary):not(.option-btn):hover:not(:disabled) {
      background: linear-gradient(135deg, #f6d891, var(--accent-hover));
    }

    button:focus-visible, a:focus-visible, .zoomable-image:focus-visible {
      outline: 3px solid #fff1c7;
      outline-offset: 3px;
    }

    button.option-btn {
      background: var(--card-soft);
      color: var(--text);
      border: 1px solid var(--border);
      text-align: left;
      font-weight: 600;
    }

    button.option-btn.correct { background: var(--success); color: #052e16; border-color: var(--success); }
    button.option-btn.wrong { background: var(--error); color: #fff; border-color: var(--error); }

    .chat-bubble {
      background: rgba(18, 48, 37, 0.9);
      border-left: 4px solid var(--accent);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1.05rem;
      margin: 14px 0;
      white-space: pre-line;
    }

    .photo-frame {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #101914;
      margin: 12px 0 16px;
      border: 1px solid rgba(239, 195, 106, 0.36);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .photo-frame img {
      width: 100%;
      display: block;
      max-height: 360px;
      object-fit: contain;
      background: #0b1120;
    }

    .zoomable-image { cursor: zoom-in; }

    .image-lightbox:not([open]) { display: none; }

    .image-lightbox[open] {
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      border: 0;
      display: flex;
      flex-direction: column;
      padding: 64px 8px 8px;
      overflow: hidden;
      color: var(--text);
      background: rgba(15, 23, 42, 0.82);
    }

    .image-lightbox::backdrop { background: rgba(0, 0, 0, 0.25); }

    .image-lightbox-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .image-lightbox-controls button {
      width: auto;
      min-width: 44px;
      margin: 0;
      padding: 10px 12px;
    }

    .image-lightbox-viewport {
      display: flex;
      flex: 1;
      min-height: 0;
      align-items: flex-start;
      justify-content: flex-start;
      overflow: auto;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .image-lightbox-image {
      display: block;
      flex: none;
      object-fit: contain;
    }

    .feedback-img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 10px;
      display: block;
      background: #0b1120;
    }

    .feedback {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(43, 73, 58, 0.92);
      border-left: 4px solid #efc36a;
    }

    .grid-24 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .door {
      aspect-ratio: 1;
      border-radius: 12px;
      background: linear-gradient(145deg, #2d4d3a, #263d39);
      border: 1px solid rgba(201, 188, 132, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .door.done { border-color: var(--success); background: linear-gradient(145deg, rgba(96, 153, 100, 0.28), rgba(39, 72, 53, 0.92)); }
    .door.locked { opacity: 0.45; pointer-events: none; }
    .door span { font-size: 0.72rem; font-weight: 500; color: var(--muted); margin-top: 2px; }

    .footer-nav {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer-nav a { color: #f0c66f; text-decoration: none; font-weight: 600; font-size: 0.92rem; }

  </style>
</head>
<body>
  <div class="background-dots" id="background-dots" aria-hidden="true"></div>
  <header>
    <a href="./" id="home-link">← Übersicht</a>
    <div class="badge" id="score-badge">Punkte: 0</div>
  </header>
  <main id="app"></main>
  <script>
    const punkte = document.getElementById("background-dots");
    const anzahlPunkte = 90;

    for (let i = 0; i < anzahlPunkte; i++) {
      const punkt = document.createElement("span");
      const groesse = Math.random() < 0.12 ? 2 : 1;
      punkt.style.left = `${Math.random() * 100}%`;
      punkt.style.top = `${Math.random() * 100}%`;
      punkt.style.width = `${groesse}px`;
      punkt.style.height = `${groesse}px`;
      punkt.style.opacity = `${0.2 + Math.random() * 0.55}`;
      punkte.appendChild(punkt);
    }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
